server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name localhost;
    
    location / {
        proxy_pass http://backend:3000;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name localhost;

    ssl_certificate /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;

    location / {
        proxy_pass http://backend:3000;
    }
}